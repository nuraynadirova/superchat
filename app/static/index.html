<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuperChat</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1d2433; --muted:#6b7385; --accent:#3b5bdb;
          --flights:#0b7285; --shopping:#c2410c; --cinema:#7c3aed; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg);
         color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid #e3e6ec;
           display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:18px; }
  header small { color:var(--muted); }
  header button { border:1px solid #d0d5dd; background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; }
  #log { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; }
  .msg { margin:10px 0; display:flex; flex-direction:column; }
  .msg.user { align-items:flex-end; }
  .bubble { padding:10px 14px; border-radius:14px; max-width:85%; white-space:pre-wrap; line-height:1.45; }
  .user .bubble { background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bot .bubble { background:var(--card); border:1px solid #e3e6ec; border-bottom-left-radius:4px; }
  .tag { font-size:11px; color:var(--muted); margin:3px 6px; }
  .tag b { font-weight:600; }
  .tag .flights { color:var(--flights); } .tag .shopping { color:var(--shopping); } .tag .cinema { color:var(--cinema); }
  form { display:flex; gap:8px; padding:14px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #d0d5dd; font-size:15px; }
  form button { padding:0 18px; border-radius:10px; border:0; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  .typing { color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<header>
  <div><h1>SuperChat</h1><small>Flights · Shopping · Cinema — one chat</small></div>
  <button id="reset" title="Start a new session">New chat</button>
</header>
<div id="log"></div>
<form id="f">
  <input id="m" autocomplete="off" placeholder="Ask about flights, products or films…" autofocus>
  <button>Send</button>
</form>
<script>
  let sessionId = crypto.randomUUID();
  const log = document.getElementById("log");

  function add(role, text, meta) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    div.appendChild(b);
    if (meta) {
      const t = document.createElement("div");
      t.className = "tag";
      const doms = (meta.domains || []).map(d => `<b class="${d}">${d}</b>`).join(" + ");
      t.innerHTML = meta.category + (doms ? " · " + doms : "");
      div.appendChild(t);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("m");
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    add("user", text);
    const wait = add("bot", "…");
    wait.querySelector(".bubble").classList.add("typing");
    try {
      const r = await fetch("/api/chat", {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId, message: text})
      });
      const data = await r.json();
      wait.remove();
      add("bot", data.reply || "(no reply)", data);
    } catch (err) {
      wait.remove();
      add("bot", "Connection error. Please try again.");
    }
  });

  document.getElementById("reset").addEventListener("click", async () => {
    await fetch("/api/reset", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({session_id: sessionId, message: ""})});
    sessionId = crypto.randomUUID();
    log.innerHTML = "";
  });
</script>
</body>
</html>
